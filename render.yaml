services:
  - type: web
    name: mehfooz-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mehfooz-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: mehfooz-redis
          type: redis
          property: connectionString
      # LibreTranslate – free tier on libretranslate.com requires an API key.
      # Get one free at https://libretranslate.com (sign up, no credit card).
      # To self-host on Render instead: deploy libretranslate/libretranslate as
      # a separate Web Service and point LIBRETRANSLATE_URL at its internal URL.
      - key: LIBRETRANSLATE_URL
        value: https://libretranslate.com
      - key: LIBRETRANSLATE_ENABLED
        value: "true"
      - key: LIBRETRANSLATE_API_KEY
        sync: false   # set this secret in the Render dashboard → Environment
      # TTS: use Edge TTS (free Microsoft neural voices, no API key needed)
      # Change to "gtts" if Edge TTS has cold-start issues, or "auto" to try Google Cloud first.
      - key: TTS_ENGINE
        value: edge

  - type: worker
    name: mehfooz-worker
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.tasks worker --loglevel=info
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mehfooz-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: mehfooz-redis
          type: redis
          property: connectionString
      - key: LIBRETRANSLATE_URL
        value: https://libretranslate.com
      - key: LIBRETRANSLATE_ENABLED
        value: "true"
      - key: LIBRETRANSLATE_API_KEY
        sync: false   # set this secret in the Render dashboard → Environment
      - key: TTS_ENGINE
        value: edge

databases:
  - name: mehfooz-db
    plan: free

redis:
  - name: mehfooz-redis
    plan: free
