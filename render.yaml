services:
  - type: web
    name: mehfooz-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mehfooz-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: mehfooz-redis
          type: redis
          property: connectionString

  - type: worker
    name: mehfooz-worker
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.tasks worker --loglevel=info
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mehfooz-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: mehfooz-redis
          type: redis
          property: connectionString

databases:
  - name: mehfooz-db
    plan: free

redis:
  - name: mehfooz-redis
    plan: free
